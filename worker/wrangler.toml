name = "mayeko-contact"
main = "src/index.js"
compatibility_date = "2026-11-01"
compatibility_flags = ["nodejs_compat"]
workers_dev = false

routes = [
  { pattern = "mayeko.org/api/contact", zone_name = "mayeko.org" },
  { pattern = "www.mayeko.org/api/contact", zone_name = "mayeko.org" },
  # Pages, repo kökündeki worker/ kaynaklarını da yayınlıyor; bu yolları 404 ile kapat
  { pattern = "mayeko.org/worker/*", zone_name = "mayeko.org" },
  { pattern = "www.mayeko.org/worker/*", zone_name = "mayeko.org" }
]

# Mail, Cloudflare Email Sending ile gönderilir (mayeko.org Email Sending'e onboard; MX Hostinger'da).
# Hostinger SMTP kullanılamaz: sunucuları Cloudflare IP'lerinin arkasında, Workers oraya TCP açamaz.
# Ücretsiz planda alıcı, hesapta doğrulanmış bir destination address olmalı.
[[send_email]]
name = "EMAIL"
allowed_sender_addresses = ["info@mayeko.org"]
allowed_destination_addresses = ["info@mayeko.org"]

[vars]
FROM_ADDRESS = "info@mayeko.org"
TO_ADDRESS = "info@mayeko.org"
ALLOWED_ORIGINS = "https://mayeko.org,https://www.mayeko.org"
# Gizli: TURNSTILE_SECRET  →  npx wrangler secret put TURNSTILE_SECRET
